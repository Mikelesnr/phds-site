[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm

[program:nginx]
command=nginx -g "daemon off;"

; Websocket server for team chat. Only runs when BROADCAST_CONNECTION=reverb,
; otherwise it idles and the chat polls instead. Nginx proxies /app to it.
[program:reverb]
command=sh -c 'if [ "$BROADCAST_CONNECTION" = "reverb" ]; then exec php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=8080; else echo "Reverb is off (BROADCAST_CONNECTION is not reverb)"; exec sleep infinity; fi'
directory=/var/www/html
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
